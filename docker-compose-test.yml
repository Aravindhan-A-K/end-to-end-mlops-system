services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: postgres_data
      POSTGRES_INITDB_ARGS: "-c max_connections=50 -c shared_buffers=128MB -c wal_level=minimal -c max_wal_senders=0"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d postgres_data"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 180s

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "sh", "-c", "mc alias set local http://localhost:9000 minioadmin minioadmin && mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - minio_data:/data

  create_bucket:
    image: minio/mc:latest
    container_name: create_bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo "Waiting for MinIO..."
        sleep 2
      done
      mc mb local/mlops-artifacts-aravindh-ml --ignore-existing
      '

  init_data:
    build: ./init_data
    container_name: init_data
    depends_on:
      create_bucket:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      sh -c "
      python -c 'import boto3; s3=boto3.client(\"s3\", endpoint_url=\"http://minio:9000\", aws_access_key_id=\"minioadmin\", aws_secret_access_key=\"minioadmin\"); s3.upload_file(\"/data/hour.csv\", \"mlops-artifacts-aravindh-ml\", \"data/hour.csv\")'
      "

  mlflow:
    build: ./mlflow
    container_name: mlflow
    depends_on:
      postgres: 
        condition: service_healthy
      create_bucket:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://mlflow:mlflow@postgres:5432/postgres_data
      --default-artifact-root s3://mlops-artifacts-aravindh-ml/artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts '*'
    environment:
      DB_URI: postgresql+psycopg2://mlflow:mlflow@postgres:5432/postgres_data
      ARTIFACT_URI: s3://mlops-artifacts-aravindh-ml/artifacts
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000').raise_for_status()"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  training:
    build: ./training
    container_name: train_pipeline
    depends_on:
      mlflow:
        condition: service_healthy
      init_data:
        condition: service_completed_successfully
    command: >
      sh -c "
      for i in $(seq 1 60); do
        python -c 'import requests; requests.get(\"http://mlflow:5000\").raise_for_status()' && break
        echo 'Waiting for MLflow...' && sleep 2
      done &&
      python train.py
      "
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ENVIRONMENT: Production
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      DATA_PATH: s3://mlops-artifacts-aravindh-ml/data/hour.csv
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      S3_ENDPOINT_URL: http://minio:9000

  app:
    build: .
    container_name: app
    depends_on:
      mlflow: 
        condition: service_healthy
      training:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ENVIRONMENT: Production
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/').raise_for_status()"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s

  test:
    image: python:3.12-slim
    container_name: tests
    working_dir: /tests
    depends_on:
      mlflow:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - ./tests:/tests
    command: >
      bash -c "
      pip install pytest requests &&
      for i in $(seq 1 60); do
        python -c 'import requests; requests.get(\"http://app:8000\").raise_for_status()' && break
        echo 'Waiting for app...' && sleep 2
      done &&
      pytest /tests/test_integration.py -v
      "

volumes:
  postgres_data:
  minio_data: