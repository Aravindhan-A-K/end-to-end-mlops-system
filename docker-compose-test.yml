services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: postgres_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_data"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  create_bucket:
    image: minio/mc:latest
    container_name: create_bucket
    depends_on:
      minio:
        condition: service_started
    entrypoint: /bin/sh
    command: -c "
      sleep 10;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/mlops-artifacts-aravindh-ml --ignore-existing;
      exit 0;
      "
  init_data:
    image: python:3.8-slim
    container_name: init_data
    depends_on:
      minio:
        condition: service_started
      create_bucket:
        condition: service_completed_successfully
    volumes:
      - ./data:/data
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      sh -c "
      sleep 15 &&
      pip install boto3 &&
      python -c 'import boto3; s3=boto3.client(\"s3\", endpoint_url=\"http://minio:9000\", aws_access_key_id=\"minioadmin\", aws_secret_access_key=\"minioadmin\"); s3.upload_file(\"/data/hour.csv\", \"mlops-artifacts-aravindh-ml\", \"Data/hour.csv\")'
      "
  mlflow:
    build: ./mlflow
    container_name: mlflow
    depends_on:
      postgres: 
        condition: service_healthy
      minio:
        condition: service_started
      create_bucket:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://mlflow:mlflow@postgres:5432/postgres_data
      --default-artifact-root s3://mlops-artifacts-aravindh-ml/artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts '*'
    environment:
      DB_URI: postgresql+psycopg2://mlflow:mlflow@postgres:5432/postgres_data
      ARTIFACT_URI: s3://mlops-artifacts-aravindh-ml/artifacts
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000').raise_for_status()"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  app:
    build: .
    container_name: app
    depends_on:
      mlflow: 
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ENVIRONMENT: Production
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/').raise_for_status()"]
      interval: 20s
      retries: 10
      start_period: 60s
    
  training:
    build: ./training
    container_name: train_pipeline
    depends_on:
      mlflow:
        condition: service_healthy
      minio:
        condition: service_started
      create_bucket:
        condition: service_completed_successfully
      init_data:
        condition: service_completed_successfully
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ENVIRONMENT: Production
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      DATA_PATH: s3://mlops-artifacts-aravindh-ml/data/hour.csv
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      S3_ENDPOINT_URL: http://minio:9000
    command: tail -f /dev/null
  test:
    image: python:3.12-slim
    container_name: tests
    working_dir: /tests
    depends_on:
      mlflow:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - ./tests/test_integrations.py:/tests/test_integration.py
    command: >
      bash -c "pip install pytest requests && pytest /tests/test_integration.py -v"
  

volumes:
  postgres_data:
  minio_data:
  


  
